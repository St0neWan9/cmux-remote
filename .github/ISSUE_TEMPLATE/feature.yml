name: Feature request
description: Something Cmux Remote should do differently or do as well.
labels: ["enhancement"]
body:
  - type: textarea
    id: proposal
    attributes:
      label: What should change
      description: Describe the situation you are in and what Cmux Remote should do instead.
      placeholder: |
        Right now …
        I would like it to …
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: Where
      options:
        - iPhone
        - Android
        - Mac companion
        - Bridge / relay
        - Not sure
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else (optional)
      description: Screenshots of other apps that do this well are welcome. No private data.
